[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web"
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,tools/*,docs/*,*.md,assets/sprites/chars/minotaur_*.png,assets/sprites/chars/centaur_*.png,assets/sprites/chars/harpy_*.png,assets/sprites/chars/lamia_*.png,assets/sprites/chars/oni_*.png,assets/sprites/chars/tengu_*.png,assets/portraits/minotaur_*.png,assets/portraits/centaur_*.png,assets/portraits/harpy_*.png,assets/portraits/lamia_*.png,assets/portraits/oni_*.png,assets/portraits/tengu_*.png,assets/sprites/chars/*_v4.png,assets/sprites/chars/*_v5.png,assets/portraits/*_v4.png,assets/portraits/*_v5.png,assets/sprites/buildings/*_back.png,assets/sprites/buildings/*_back_glow.png,assets/sprites/buildings/v_*.png,assets/sprites/buildings/bandit_*.png,assets/sprites/buildings/machine_*.png,assets/sprites/buildings/ruin_*.png,assets/sprites/buildings/trade_*.png,assets/sprites/buildings/wanderer_*.png,assets/sprites/buildings/wreck_*.png"
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encryption_key=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://web_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas=true
html/experimental_virtual_keyboard=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/enabled=true

