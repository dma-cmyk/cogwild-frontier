<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#171d2a">
	<meta name="description" content="Cogwild Frontier — build a frontier settlement with your autonomous crew.">
	<title>Cogwild Frontier</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171d2a; color: #f1e3bd; }
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #171d2a; }
		body { display: grid; place-items: center; }
		#game { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #34445a, #171d2a 72%); }
		#canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
		#loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; pointer-events: auto; transition: opacity .25s ease; }
		#loading h1 { margin: 0; color: #ead9ad; font-size: clamp(22px, 5vw, 38px); letter-spacing: .08em; text-shadow: 0 3px 16px #000a; }
		#loading p { margin: 0; color: #c6d0d9; font-size: 14px; }
		#track { width: min(68vw, 340px); height: 8px; margin: auto; border: 1px solid #8d7952; border-radius: 99px; background: #131923; overflow: hidden; }
		#bar { width: 3%; height: 100%; background: linear-gradient(90deg, #4a76bd, #dfc373); border-radius: inherit; transition: width .15s ease; }
		#status { min-height: 1.2em; }
		#reload { justify-self: center; border: 1px solid #d9b04c; border-radius: 6px; padding: 10px 18px; color: #f1e3bd; background: #28364a; font: inherit; cursor: pointer; }
		#reload[hidden] { display: none; }
		#loading.failed { background: #171d2aeF; }
		#loading.failed #track { display: none; }
	</style>
	<script src="$GODOT_URL"></script>
</head>
<body>
	<main id="game">
		<canvas id="canvas" tabindex="0"></canvas>
		<section id="loading" aria-live="polite">
			<h1>COGWILD FRONTIER</h1>
			<p>開拓地を準備しています · Preparing the frontier</p>
			<div id="track"><div id="bar"></div></div>
			<p id="status">Loading game…</p>
			<button id="reload" type="button" hidden>再読み込み / Reload</button>
		</section>
	</main>
	<script>
		const status = document.getElementById("status");
		const bar = document.getElementById("bar");
		const loading = document.getElementById("loading");
		const reload = document.getElementById("reload");
		let lastProgressAt = Date.now();
		let lastProgress = -1;
		const watchdog = setInterval(() => {
			if (Date.now() - lastProgressAt < 20000 || loading.dataset.ready === "true" || loading.dataset.failed === "true") return;
			status.textContent = "読み込みが止まっています。通信を確認して再読み込みしてください。 / Loading appears stalled. Check your connection and reload.";
			loading.classList.add("failed");
			reload.hidden = false;
		}, 1000);
		const showFailure = () => {
			if (loading.dataset.failed === "true" || loading.dataset.ready === "true") return;
			clearInterval(watchdog);
			loading.dataset.failed = "true";
			status.textContent = "起動できませんでした。通信を確認して再読み込みしてください。 / Unable to start. Check your connection and reload.";
			loading.classList.add("failed");
			reload.hidden = false;
		};
		reload.addEventListener("click", () => window.location.reload());
		try {
			const engine = new Engine($GODOT_CONFIG);
			engine.startGame({
				'onProgress': (current, total) => {
					if (current > lastProgress) {
						lastProgress = current;
						lastProgressAt = Date.now();
					}
					if (total > 0) {
						bar.style.width = `${Math.max(3, current / total * 100)}%`;
						status.textContent = `Loading ${Math.round(current / 1048576 * 10) / 10} / ${Math.round(total / 1048576 * 10) / 10} MB (${Math.round(current / total * 100)}%)`;
					} else {
						status.textContent = `Downloaded ${Math.round(current / 1048576 * 10) / 10} MB · Starting renderer…`;
					}
				},
				'onPrint': (message) => console.log(message),
				'onPrintError': (message) => console.error(message),
			}).then(() => {
				clearInterval(watchdog);
				loading.dataset.ready = "true";
				bar.style.width = "100%";
				status.textContent = "Ready";
				setTimeout(() => { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 300); }, 300);
			}).catch((error) => {
				showFailure();
				console.error(error);
			});
		} catch (error) {
			showFailure();
			console.error(error);
		}
	</script>
</body>
</html>
